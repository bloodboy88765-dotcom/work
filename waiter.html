<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiter Portal | Ayush</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Settings Loader -->
    <script src="settings-loader.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .waiter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }
        .ready-card {
            background: var(--color-bg-card);
            border: 2px solid #28a745;
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: #28a745; box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.4); }
            70% { border-color: #28a745; box-shadow: 0 0 0 10px rgba(40, 167, 69, 0); }
            100% { border-color: #28a745; box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }
        .table-badge-lg {
            background: #28a745;
            color: white;
            padding: 0.8rem;
            border-radius: 12px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
        }
        .items-summary {
            background: rgba(255,255,255,0.03);
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body style="background: var(--color-bg-matte);">
    <header style="padding: 2rem; border-bottom: 1px solid rgba(212, 175, 55, 0.1); display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1 style="font-family: 'Playfair Display', serif; color: var(--color-gold);">Waiter Portal</h1>
            <p style="color: var(--color-gray);">Pick-up Alerts & Deliveries</p>
        </div>
        <div id="status-bar" style="display: flex; gap: 2rem;">
            <div class="stat-card" style="text-align: center;">
                <div style="font-size: 0.8rem; color: var(--color-gray);">Ready to Serve</div>
                <div id="ready-count" style="font-size: 1.5rem; font-weight: 700; color: #28a745;">0</div>
            </div>
        </div>
    </header>

    <main>
        <div class="waiter-grid" id="waiter-calls">
            <!-- Delivery calls will be injected here -->
        </div>
    </main>

    <script src="notifications.js"></script>
    <script src="waiter.js"></script>
</body>
</html>
